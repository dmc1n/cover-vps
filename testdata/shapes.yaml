# Procedural test shapes for golden tests (generated by testdata/generate.py).
# Fixture data, not parameters: changing a value here changes the golden references and needs a
# DECISIONS.md entry. All dimensions in mm, Z up, ground at z = 0.
#
# Dimensions are whole numbers and round shapes use segment counts that are multiples of 4, so
# the extreme vertices (bounding box) are stored exactly in STL's 32-bit floats (ADR-019).

format_version: 1

analytic:
  plate:           {size_x: 1000, size_y: 600, div_x: 20, div_y: 12}
  cylinder:        {radius: 250, height: 600, segments: 64, rings: 12}       # open both ends
  cone:            {radius: 300, height: 600, segments: 64, rings: 12}       # apex up, base open
  sphere:          {radius: 300, segments: 64, rings: 32}                    # resting on ground
  sphere_octant:   {radius: 300, divisions: 24}                              # x, y, z >= 0
  saddle:          {size: 800, curvature_radius: 1000, divisions: 32}        # z = (x²-y²)/2R, lifted to ground
  torus_segment:   {major_radius: 400, minor_radius: 100, angle_deg: 90, segments: 24, tube_segments: 24}

furniture:
  box_with_legs:
    body: [800, 600, 400]          # x, y, z of the box
    leg: [50, 50, 300]             # legs under the four corners; box sits on top
  slatted_table:
    length: 1600                   # along x (slat direction)
    slat_width: 80
    slat_thickness: 25
    slat_gap: 20
    slats: 9                       # depth = 9 * 80 + 8 * 20 = 880
    height: 740                    # top of the slats
    leg: [60, 60]                  # leg section; legs inset by leg_inset from the top corners
    leg_inset: 50
    rail: [60, 80]                 # two rails along y under the slats (width x, height z)
  chair:
    seat: [500, 500, 40]           # x, y, z
    seat_height: 460               # top of the seat
    back: [500, 40, 500]           # x, thickness, length along the back
    back_tilt_deg: 15              # tilted backwards (toward +y)
    leg: [40, 40]
  l_lounge:
    main: [2000, 800, 700]         # along x, front toward -y
    wing: [800, 1400, 700]         # overlapping the right end of the main block, extends to +y
