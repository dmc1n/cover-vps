[project]
name = "cover-pattern-engine"
version = "0.0.0"
description = "Workspace root for the cover pattern engine"
requires-python = ">=3.12,<3.13"
dependencies = ["coverengine"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine"]

[tool.uv.sources]
coverengine = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["testdata/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
files = ["engine/coverengine"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
