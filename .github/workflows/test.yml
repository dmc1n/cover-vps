name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GL runtime for OpenCascade and pymeshlab
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libxrender1 libxext6 libxi6 libxkbcommon0 \
            libglib2.0-0 libdbus-1-3 libfontconfig1 libsm6 libice6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-packages --all-extras
      - name: make test
        run: make test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web app type check and build
        run: cd apps/web && npm ci --no-audit --no-fund && npm run build
