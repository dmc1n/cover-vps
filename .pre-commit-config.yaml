# Local hooks use the project's own pinned tools (uv.lock), so versions never drift.
repos:
  - repo: local
    hooks:
      - id: no-merge-markers
        name: no merge conflict markers
        entry: bash -c 'if grep -nE "^(<<<<<<<|>>>>>>>) |^=======$" "$@"; then echo "merge conflict markers left"; exit 1; fi' --
        language: system
        types: [text]
        exclude: '\.(svg|dxf)$'
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: no-param-literals
        name: no numbers that duplicate a default (config/defaults.yaml)
        entry: uv run pytest -q engine/tests/test_no_param_literals.py
        language: system
        types: [python]
        pass_filenames: false
