# Cover pattern engine — default parameters.
#
# Every number the engine uses lives in this file. To change a value: edit it here, commit,
# re-run `cover run <model>` (or press "recompute" in the web app). No code changes needed.
#
# Per-model values in a CoverDefinition override these; a UI slider or a CLI flag
# (`--set hull.clearance_mm=15`) overrides both for a single trial run.
# `cover params <model>` shows the value in effect and where it came from.
#
# "to confirm" marks an assumption from planning, not a measured or agreed value.

units: mm                        # everything in millimetres; do not change

hull:                            # the cover surface (drape hull)
  clearance_mm: 10               # distance between furniture and fabric; raise for a looser fit
  bridge_gap_mm: 60              # gaps narrower than this are bridged by the fabric (slats);
                                 # wider recesses (seat to back) are followed
  hem_height_mm: 50              # to confirm; hem edge above the ground
  resolution_mm: 5               # grid resolution; smaller is slower and more exact
  smoothing: 0.5                 # 0 = follow every detail, 1 = maximum smoothing
  sweep_down: true               # fabric hangs from the widest point; false = fitted shell
  target_edge_length_mm: 15      # mesh density of the hull

seams:
  ridge_angle_deg: 40            # hull edges sharper than this become seam candidates
  min_weld_radius_mm: 150        # to confirm at the machine (weld curvature test, M8)
  seam_tolerance_mm: 1.0         # allowed seam length mismatch before ease is recorded
  lap_rule: upper_over_lower     # water run-off; on vertical seams: front over side

construction:                    # how panels are joined; a dropdown per model in the web app
  method: double_stitch          # double_stitch | welded   (double stitching is today's practice)

stitching:                       # used when construction.method is double_stitch
  allowance_mm: 15               # to confirm; seam allowance for the double-stitched seam

welding:                         # used when construction.method is welded
  overlap_mm: 30                 # to confirm; carried by the upper (lap-side) panel only
  guide_line: true               # pen line on the under panel where the upper edge lands

hem:
  type: drawcord_channel         # to confirm: drawcord_channel | elastic_channel | plain
  allowance_mm: 50               # to confirm
  cord_exits: 2

features:                        # per-cover defaults, overridden per model
  strap_marks: 0                 # wind strap attachment marks (pen)
  vents: 0
  handles: 0

fabric:
  profile: acrylic-300           # testdata/fabrics/<profile>.json
  max_allowed_stretch_pct: 2.0   # above this the engine proposes an extra seam

roll:
  width_mm: 1500
  usable_width_mm: 1480          # no panel wider than this in its narrowest orientation

flatten:
  solver: slim                   # slim | arap
  iterations: 50
  panel_tolerance_mm: 2.5        # per-panel error budget behind the ±5 mm cover tolerance

export:
  cut_layer: CUT                 # TODO from the M0 machine test
  pen_layer: PEN                 # TODO from the M0 machine test
  text_mode: text                # text | strokes, TODO from the M0 machine test
  arcs: polyline                 # arc | polyline, TODO from the M0 machine test
  sheet_spacing_mm: 20           # spacing between panels on the export sheet
  dxf_version: R2010

pen:
  label_height_mm: 15
  tick_length_mm: 10
  tick_spacing_mm: 300           # alignment ticks along shared seams

import:
  min_part_mm: 8                 # parts smaller than this (screws, washers) are dropped
  deflection_mm: 0.5             # STEP tessellation accuracy
  default_units: mm

tolerance:
  cover_mm: 5.0                  # overall fit target: ±5 mm
