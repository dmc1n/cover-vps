# Cover pattern engine — default parameters.
#
# Every number the engine uses lives in this file. To change a value: edit it here, commit,
# re-run `cover run <model>` (or press "recompute" in the web app). No code changes needed.
#
# Per-model values in a CoverDefinition override these; a UI slider or a CLI flag
# (`--set hull.clearance_mm=15`) overrides both for a single trial run.
# `cover params <model>` shows the value in effect and where it came from.
#
# "to confirm" marks an assumption from planning, not a measured or agreed value.

units: mm                        # everything in millimetres; do not change

hull:                            # the cover surface (drape hull)
  clearance_mm: 10               # distance between furniture and fabric; raise for a looser fit
  bridge_gap_mm: 60              # gaps narrower than this are bridged by the fabric (slats);
                                 # wider recesses (seat to back) are followed
  hem_height_mm: 50              # to confirm; hem edge above the ground
  resolution_mm: 5               # grid resolution; smaller is slower and more exact
  smoothing: 0.5                 # 0 = follow every detail, 1 = maximum smoothing
  sweep_down: true               # fabric hangs from the widest point; false = fitted shell
  edge: rounded                  # rounded | sharp   where the top meets the skirt: rounded with the
                                 # clearance as radius, or a crease (boxy furniture only: it
                                 # fails on rounded tops)
  top: tensioned                 # tensioned | draped | box | given
                                 # tensioned: pulled tight in straight lines between high
                                 # points, sheds water (rule 12); draped: follows recesses
                                 # wider than bridge_gap_mm; box: flat faces (ADR-038)
                                 # given: the uploaded file is the cover surface itself (ADR-039)
  min_slope_deg: 5               # to confirm; flatter patches of the top hold water
  flat_patch_mm: 100             # flat spots smaller than this across, or this close to the edge,
                                 # still shed water
  box_pieces: 0                  # box cover: number of flat pieces; 0 = chosen by the AI (or, without
                                 # AI, the fewest within box_volume_slack_pct of the tightest box)
  box_max_pieces: 10             # box cover: options tried, up to this many pieces
  box_volume_slack_pct: 5        # box cover without AI: extra volume allowed over the tightest box
  support: none                  # none | balloons | balloon | frame   support under the cover
                                 # for flat tops (tables): balloons = the workshop's balloons
                                 # (balloon_model) in a grid; frame = a ridge beam along the long
                                 # axis, a gable roof that lies flat; balloon = a dome
  chairs: auto                   # auto | none | dining | low_dining | low_bar   the chairs pushed
                                 # in along the two long sides of a table, covered too (owner,
                                 # 1 Oct 2026); auto: by the name and the table height
  chair_room_mm: 330             # chair space beyond the table top on each long side (owner: a
                                 # 100 cm table gets a 166 cm cover)
  chair_height_dining_mm: 870    # cover height over dining tables of 74 to 77 cm (owner: as T1)
  chair_height_low_dining_mm: 870  # the same as dining (owner, 1 Oct 2026: same cover)
  chair_height_low_bar_mm: 1230  # owner, 1 Oct 2026: as the round bar covers R5, R6, R10
  dining_table_min_mm: 740       # a table this high up to dining_table_max_mm is a dining table
  dining_table_max_mm: 770
  balloon_model: table-baloon    # the balloon's model folder (owner, 1 Oct 2026: one size)
  balloon_count: 0               # balloons under a table; 0 = chosen by the AI (or, without AI,
                                 # the fewest with which all water runs off)
  balloon_max: 8                 # balloons: options tried, up to this many
  balloon_spacing_mm: 1100       # without AI about one balloon per this table length (owner,
                                 # 1 Oct 2026: a 340 cm table gets 3 to 4); always at least 1
  support_height_mm: 0           # balloon or ridge height above the top; 0 = lowest that sheds
                                 # water
  support_radius_mm: 150         # to confirm; radius of the balloon's dome
  target_edge_length_mm: 15      # mesh density of the hull
  smoothing_max_iterations: 20   # smoothing passes at smoothing = 1 (Taubin, keeps the volume)
  remesh_passes: 5               # rounds of even remeshing towards target_edge_length_mm
  remesh_max_deviation_mm: 0.5   # remeshing may move the surface at most this far
  clearance_passes: 10           # rounds of pushing the hull out where it is closer than
                                 # clearance_mm to the furniture
  max_grid_cells: 60000000       # above this the grid is made coarser (with a warning)

seams:
  ridge_angle_deg: 40            # hull edges sharper than this become seam candidates
  min_piece_width_mm: 100        # to confirm (owner, 2026-10-02: to learn from our analyses);
                                 # a box cover's flat face narrower than this (a sliver) is
                                 # joined to its neighbour, with a fold (ADR-055)
  fold_merge: false              # true (per model, on the owner's request, ADR-055): neighbouring
                                 # top faces that lie flat together on the roll are one piece,
                                 # a fold line in pen instead of a seam
  min_weld_radius_mm: 150        # to confirm at the machine (weld curvature test, M8)
  seam_tolerance_mm: 1.0         # allowed seam length mismatch before ease is recorded
  lap_rule: upper_over_lower     # water run-off; on vertical seams: front over side
  skirt_seam_inset_mm: 1         # the top counts as rounding over where it is this far inside
                                 # the outline seen from above
  skirt_seam: level              # level | follow_rim. level (owner, 2026-09-30, all covers): the
                                 # skirt seam at one height all round, so skirt panels are straight
                                 # strips and seams are easy lines for clean stitching. follow_rim:
                                 # just below the rounded top edge, smoothed (for comparison)
  skirt_height_mm: 0             # level skirt height above the hem; 0 = automatic, just below the
                                 # lowest point of the top edge. Set per model to match a cover
  min_skirt_height_mm: 150       # to confirm; the automatic skirt is at least this high (where
                                 # legs splay out, the cover runs down to the feet)
  skirt_below_rim_mm: -3         # the level skirt seam runs this far below where the top edge
                                 # starts to round over (negative: that far up the rounding, so the
                                 # top panel does not reach down onto the upright part)
  rim_smoothing_mm: 200          # the top edge is followed smoothed over this length
  wall_min_mm: 20                # where the top edge stands more than this above the level skirt
  wall_min_length_mm: 300        # ... over at least this length, the upright part between is a
                                 # wall panel (the back of a chair), so the top does not wrap down
  max_wiggle_mm: 2               # every edge of a flat panel must be a smooth line: at most this
                                 # far from itself smoothed over 30 mm, or a warning
  corner_angle_deg: 45           # the skirt gets a vertical seam where its outline turns more
  corner_window_mm: 100          # ... than this within this length
  min_skirt_panel_mm: 300        # to confirm; corners closer together than this get one seam
  max_skirt_panel_mm: 3000       # to confirm; longer skirt stretches are split into equal parts
  snap_mm: 1                     # points closer than this to a seam are moved onto it
  band_drop_mm: 20               # a top too wide for the roll is first split this far below its
                                 # highest point (the band on top of a backrest), then at half
                                 # height; level seams let the upper panel lap over the lower

construction:                    # how panels are joined; a dropdown per model in the web app
  method: double_stitch          # double_stitch | welded   (double stitching is today's practice)

stitching:                       # used when construction.method is double_stitch
  allowance_mm: 15               # to confirm; seam allowance for the double-stitched seam
  sides: both                    # both | lap   to confirm: allowance on both panels of a seam, or
                                 # only on the panel that laps over

welding:                         # used when construction.method is welded
  overlap_mm: 30                 # to confirm; carried by the upper (lap-side) panel only
  guide_line: true               # pen line on the under panel where the upper edge lands

hem:
  type: drawcord_channel         # drawcord_channel | elastic_channel | plain   every cover has a
                                 # drawcord at the bottom to tighten it (owner, 1 Oct 2026)
  allowance_mm: 50               # to confirm
  cord_exits: 2

features:                        # per-cover defaults, overridden per model
  strap_marks: 0                 # wind strap attachment marks (pen)
  vent_width_mm: 250             # air vent opening (owner 2026-09-30): a hood of extra fabric
  vent_height_mm: 220            # holds a plastic insert that keeps it open; a membrane inside
                                 # keeps dirt out
  vent_logo: true                # every air vent carries the logo (owner, 1 Oct 2026): a frame
                                 # marked LOGO on the hood, in pen
  vent_logo_width_mm: 120        # to confirm: the logo's size on the hood
  vent_logo_height_mm: 40        # to confirm
  middle_cord: false             # a second drawcord halfway up the cover (table covers, owner
                                 # 1 Oct 2026; on in the table preset): a pen line on the sides
  vent_min_height_mm: 100        # a low side gets a lower opening (same width, same insert,
                                 # hood and membrane), not lower than this (owner, 1 Oct 2026)
  vent_above_hem_mm: 50          # bottom edge of the vent above the lower end of the cover
  vents_per_metre: 1             # one vent per full metre of each side, spread evenly (owner,
                                 # 1 Oct 2026: each side separately; 2.90 m: 2, 3.10 m: 3)
  vents_min: 1                   # every cover has at least one vent, and every side of it too
                                 # (owner, 1 Oct 2026: one per metre, at least one on each side)
  vent_seam_clearance_mm: 100    # to confirm; a vent keeps this far from a vertical seam; a short
                                 # side gets its vent centred, closer (owner: it must have one)
  vent_hood_depth_mm: 80         # to confirm; the hood piece is this much deeper than the vent
  handles: 0

fabric:
  profile: acrylic-300           # testdata/fabrics/<profile>.json
  max_allowed_stretch_pct: 2.0   # above this the engine proposes an extra seam

rain:                            # cover rain: where rain goes on a cover (ADR-049)
  cell_mm: 15                    # grid seen from above
  drops: 240                     # drops traced for the 3D view
  pond_mm: 2.5                   # water deeper than this in a hollow is a pond
  support_mm: 35                 # the cover rests on furniture or a balloon closer than this
  fabric_tension_n_per_m: 800    # TO CONFIRM (swatch tests, M8): tension in the fitted fabric,
                                 # for the sag of a pond between supports
  seam_run_mm: 250               # water running along a seam further than this soaks in

drape:                           # the drape simulation: the sewn cover falling over the furniture (ADR-056)
  fabric_g_m2: 300               # to confirm: the fabric's weight (acrylic canvas, WeatherMax ~ 300)
  max_stretch_pct: 1.6           # to confirm: how far the woven fabric gives before it is tight
  stretch_stiffness: 3000.0      # the solver's weight on stretch, N/m: above the max_stretch_pct
                                 # limit the fabric is held hard; higher than this the solver itself
                                 # damps the fall (tested on a tablecloth over a box, ADR-056)
  bending_stiffness: 100.0       # to confirm: bending rigidity, N mm (1e-4 N m; high: big soft folds)
  thickness_mm: 3.5              # contact distance: the fabric's thickness and a little air
  contact_stiffness: 2000000.0   # how hard the furniture holds a point it touches (N/m, high: hard)
  friction: 0.65                 # share of the speed lost where it lies on something
  damping: 0.012                 # share of the speed lost every step (air, the fabric itself)
  steps_per_second: 60           # time steps per simulated second
  seconds: 5.0                   # at most this long; it stops sooner when the cover lies still
  iterations: 20                 # rounds per step (more: stiffer and truer, slower)
  rest_mm_s: 5                   # it lies still when 99 % of the cloth moves slower than this
  frames: 60                     # frames of the fall kept for the 3D view
  fold_deg: 28                   # a point bends at least this much between two triangles: a fold
roll:
  width_mm: 1500
  usable_width_mm: 1480          # no panel wider than this in its narrowest orientation

flatten:
  solver: slim                   # slim | arap
  iterations: 50                 # most SLIM iterations per panel
  slim_tolerance: 0.0000001      # stop when the energy improves by less than this fraction
  max_triangles: 50000           # denser panels are simplified first (outline kept exactly)
  panel_tolerance_mm: 2.5        # per-panel error budget behind the ±5 mm cover tolerance
  fabric_compensation: false     # to confirm: scale for fabric stretch; on once the profile is
                                 # measured (M8)
  stretch_quantile: 0.995        # the stretch limit applies to this share of each panel's area;
                                 # the rest (spots at corners of the cover) eases in

export:
  cut_layer: CUT                 # TODO from the M0 machine test
  pen_layer: PEN                 # TODO from the M0 machine test
  text_mode: text                # text | strokes, TODO from the M0 machine test
  arcs: polyline                 # arc | polyline, TODO from the M0 machine test
  sheet_spacing_mm: 20           # spacing between panels on the export sheet
  dxf_version: R2010

drawing:
  plan_rotation_deg: 0           # sizes.pdf: turn the top view counter-clockwise by this angle, so
                                 # it matches the workshop drawing of the model

pen:
  label_height_mm: 15
  tick_length_mm: 10
  tick_spacing_mm: 300           # alignment ticks along shared seams

import:
  min_part_mm: 8                 # parts whose largest dimension is below this (screws, washers)
                                 # are dropped
  deflection_mm: 0.5             # STEP/IGES tessellation: max distance from the true surface
  angular_deflection_deg: 20     # STEP/IGES tessellation: max angle between neighbouring
                                 # triangles on curved faces
  sew_tolerance_mm: 0.1          # IGES: faces whose edges are closer than this are joined into
                                 # one body (IGES stores loose faces)
  default_units: mm              # mm | cm | m | inch   for files that store no unit (STL, OBJ, PLY)
  up_axis: auto                  # auto | z | y | x | -z | -y | -x   the file's up direction;
                                 # auto = y for glTF/GLB (their standard), z for everything else
  front: -y                      # -y | y | -x | x   which side is the front once the model stands
                                 # upright; the model is turned so that side faces -y
  min_plausible_size_mm: 200     # warn (wrong units?) if the model's largest dimension is smaller
  max_plausible_size_mm: 6000    # ... or larger than this

tolerance:
  cover_mm: 5.0                  # overall fit target: ±5 mm

ai:                              # AI advice on cover layouts (the key: DEEPSEEK_API_KEY in deploy/.env)
  provider: deepseek             # deepseek | none
  model: deepseek-flash          # deepseek-flash = V4.1 Flash (fast, since 10 Sep 2026) |
                                 # deepseek-v4-pro = V4 Pro (stronger, slower; no 4.1 Pro yet)
  base_url: https://api.deepseek.com
  timeout_s: 120                 # how long to wait for an answer

