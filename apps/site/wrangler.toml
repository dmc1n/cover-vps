# The cover website (ADR-066): its own domain on Cloudflare. Pages and files come from the edge;
# everything about covers (the match, the price, the rain, 3D, orders, the content) from the
# studio at STUDIO_URL, through the key LINK_KEY (wrangler secret put LINK_KEY).
name = "cover-site"
main = "src/worker.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

[vars]
STUDIO_URL = "https://covers.suns.nu"
PAGE_TTL = "60"
MEDIA_TTL = "86400"

# the website's own domain, once it is on Cloudflare:
# routes = [{ pattern = "example.com", custom_domain = true }]
