<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- no maximum-scale: pinch-zoom stays; fields are 16px on touch, so iPad Safari never zooms (ADR-154) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cover Studio</title>
    <link rel="icon" href="/brand/s2dio-mark.svg" />
    <meta name="color-scheme" content="light dark" />
    <!-- on the home screen as an app (ADR-154): its own window, no address bar; no service
         worker, so every page and every answer is always live -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cover Studio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f9f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <!-- Work Sans is self-hosted (ADR-124): no font request leaves for another company -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
