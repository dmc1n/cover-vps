[project]
name = "coverengine"
version = "0.1.0"
description = "3D furniture model to 2D cover cutting patterns"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "trimesh",
  "libigl",
  "potpourri3d",
  "cadquery-ocp",
  "manifold3d",
  "pymeshlab",
  "shapely",
  "ezdxf",
  "ruamel.yaml",
  "matplotlib",
  "pymupdf",
  "newton>=1.6",
  "warp-lang>=1.17",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]

[project.scripts]
cover = "coverengine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coverengine"]
