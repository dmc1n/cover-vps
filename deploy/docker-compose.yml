# The web app on this server. Only 127.0.0.1:8080 is published (reach it through an SSH tunnel
# or the Cloudflare tunnel); nothing is open to the internet. Secrets come from deploy/.env
# (git-ignored).
#   docker compose -f deploy/docker-compose.yml up -d --build app            # the app
#   docker compose -f deploy/docker-compose.yml --profile tunnel up -d       # + Cloudflare tunnel
name: cover

services:
  app:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      COVER_DATA_DIR: /data
    volumes:
      - ${COVER_DATA_DIR:-../data}:/data
    ports:
      - "127.0.0.1:8080:8080"

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}  # from deploy/.env (Cloudflare Zero Trust)
    depends_on:
      - app
